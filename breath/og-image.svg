<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#0a0a0c"/>

  <!-- Sigil -->
  <g transform="translate(500,315)">
    <line x1="0" y1="-80" x2="0" y2="80" stroke="#c4956a" stroke-width="4" stroke-linecap="square"/>
    <line x1="0" y1="-60" x2="-44" y2="-12" stroke="#c4956a" stroke-width="5" stroke-linecap="square"/>
    <line x1="-44" y1="-12" x2="-44" y2="40" stroke="#c4956a" stroke-width="5" stroke-linecap="square"/>
    <line x1="0" y1="60" x2="44" y2="12" stroke="#c4956a" stroke-width="5" stroke-linecap="square"/>
    <line x1="44" y1="12" x2="44" y2="-40" stroke="#c4956a" stroke-width="5" stroke-linecap="square"/>
    <circle cx="0" cy="-80" r="5" fill="#f4f4f8"/>
    <circle cx="0" cy="80" r="5" fill="#f4f4f8"/>
    <circle cx="-44" cy="40" r="4" fill="#f4f4f8"/>
    <circle cx="44" cy="-40" r="4" fill="#f4f4f8"/>
    <polygon points="0,-20 14,0 0,20 -14,0" fill="none" stroke="#f4f4f8" stroke-width="2" opacity="0.5"/>
  </g>

  <!-- BREATHE text -->
  <text x="700" y="325" font-family="SF Pro Display, Helvetica Neue, Arial, sans-serif" font-size="56" font-weight="200" letter-spacing="14" fill="#f4f4f8" text-anchor="middle" dominant-baseline="middle">BREATHE</text>

  <!-- Subtle description -->
  <text x="600" y="530" font-family="SF Pro Display, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="300" letter-spacing="4" fill="#5a5a66" text-anchor="middle">90 SECONDS. NO APP. NO SIGNUP. JUST OPEN IT.</text>

  <!-- nomandre.com -->
  <text x="600" y="570" font-family="SF Pro Display, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="300" letter-spacing="3" fill="#3a3a44" text-anchor="middle">NOMANDRE.COM</text>
</svg>